name: FoundRy application checks

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/foundry-app.yml'
      - 'README.md'
      - 'canon/**'
      - 'docs/**'
      - 'evaluation/**'
      - 'governance/**'
      - 'inventory/**'
      - 'prompts/**'
      - 'templates/**'
      - 'vernacular/**'
      - 'web-templates/**'
      - 'scripts/check-markdown-links.py'
      - 'scripts/check-inventory-catalog.py'
      - 'scripts/tests/**'
      - '.agents/skills/glee-fully-repo-standardizer/scripts/scaffold.py'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/foundry-app.yml'
      - 'README.md'
      - 'canon/**'
      - 'docs/**'
      - 'evaluation/**'
      - 'governance/**'
      - 'inventory/**'
      - 'prompts/**'
      - 'templates/**'
      - 'vernacular/**'
      - 'web-templates/**'
      - 'scripts/check-markdown-links.py'
      - 'scripts/check-inventory-catalog.py'
      - 'scripts/tests/**'
      - '.agents/skills/glee-fully-repo-standardizer/scripts/scaffold.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check maintained Markdown links
        run: python scripts/check-markdown-links.py .
      - name: Check inventory catalog integration
        run: python scripts/check-inventory-catalog.py .
      - name: Test Markdown link checker
        run: python -m unittest discover -s scripts/tests -v
      - name: Exercise the application and exported packages
        run: python -m unittest discover -s app/tests -v
      - name: Check source syntax and whitespace
        run: |
          python -m py_compile app/server.py
          node --check app/static/app.js
          git diff --check
