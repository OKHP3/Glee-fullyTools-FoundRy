name: Manifest validation

on:
  pull_request:
    paths:
      - 'manifest.yaml'
      - 'schemas/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/manifest-validation.yml'

permissions:
  contents: read

jobs:
  validate-manifest:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install manifest validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate manifest schema
        run: python scripts/validate-manifest.py
      - name: Audit manifest governance fields
        run: python scripts/manifest-audit.py .