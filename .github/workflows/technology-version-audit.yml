name: Technology version audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up latest stable Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Audit technology versions
        run: python scripts/audit-technology-versions.py
