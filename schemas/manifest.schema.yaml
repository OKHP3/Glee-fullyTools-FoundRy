$schema: https://json-schema.org/draft/2020-12/schema
$id: https://glee-fully.tools/schemas/manifest.schema.yaml
title: Glee-fully FoundRy manifest
description: Schema for the repository's root manifest.yaml.
type: object
required:
  - schema_version
  - repo
  - brand
  - ecosystem
  - authority_chain
  - governance
  - toolbox_structure
  - tone_overlays
  - required_child_files
  - author
  - organization
  - contact
  - application
properties:
  schema_version:
    type: string
    const: "2.0"
  repo:
    type: object
    required:
      - name
      - display_name
      - type
      - lifecycle_status
      - visibility
      - description
    properties:
      name:
        type: string
        minLength: 1
      display_name:
        type: string
        minLength: 1
      type:
        type: string
        const: foundry-application
      lifecycle_status:
        type: string
        enum:
          - spark
          - research
          - concept
          - prototype
          - capability
          - productizing
          - product
          - active
          - archived
          - deprecated
      visibility:
        type: string
        enum:
          - public
          - private
      description:
        type: string
        minLength: 1
    additionalProperties: true
  brand:
    type: object
    required:
      - domain
      - display_name
      - public_site
      - tagline
      - tone_default
      - muse
    properties:
      domain:
        type: string
        minLength: 1
      display_name:
        type: string
        minLength: 1
      public_site:
        type: string
        format: uri
      tagline:
        type: string
        minLength: 1
      tone_default:
        type: string
        minLength: 1
      muse:
        type: string
        minLength: 1
    additionalProperties: true
  ecosystem:
    type: object
    required:
      - universe
      - universe_site
    properties:
      universe:
        type: string
        minLength: 1
      universe_site:
        type: string
        format: uri
    additionalProperties: true
  authority_chain:
    type: object
    required:
      - universe_context
      - historical_parent_foundry
      - mentoring_pattern
      - mentoring_direction
      - shared_skill_catalog
      - regional_boundary
      - this_foundry
      - public_repo
      - child_families
    properties:
      child_families:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - pattern
            - scope
          properties:
            pattern:
              type: string
              minLength: 1
            scope:
              type: string
              minLength: 1
          additionalProperties: true
    additionalProperties: true
  governance:
    type: object
    required:
      - directive_version
      - canon_seal
      - canon_ledger_count
      - canon_ledger_path
      - expansion_discipline
      - prompt_chain_version
      - prompt_chain_path
    properties:
      directive_version:
        type: string
        minLength: 1
      canon_seal:
        type: string
        minLength: 1
      canon_ledger_count:
        type: integer
        minimum: 0
      canon_ledger_path:
        type: string
        minLength: 1
      expansion_discipline:
        type: string
        minLength: 1
      prompt_chain_version:
        type: string
        minLength: 1
      prompt_chain_path:
        type: string
        minLength: 1
    additionalProperties: true
  toolbox_structure:
    type: object
    required:
      - trunk
      - branches
      - twigs
      - leaves
      - falling_leaves
    additionalProperties: true
  tone_overlays:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - style
      properties:
        id:
          type: string
          minLength: 1
        style:
          type: string
          minLength: 1
      additionalProperties: true
  required_child_files:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  author:
    type: string
    minLength: 1
  organization:
    type: string
    minLength: 1
  contact:
    type: string
    format: email
  application:
    type: object
    required:
      - entrypoint
      - runtime
      - exposure
      - working_data
      - canonical_writes
      - tests
    properties:
      entrypoint:
        type: string
        minLength: 1
      runtime:
        type: string
        minLength: 1
      exposure:
        type: string
        minLength: 1
      working_data:
        type: string
        minLength: 1
      canonical_writes:
        type: boolean
      tests:
        type: string
        minLength: 1
    additionalProperties: true
additionalProperties: true